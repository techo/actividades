[program:actividades-worker]
; Ruta al proyecto — ajustar si cambia
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/html

; Usuario con permisos sobre el proyecto (ajustar según servidor)
user=www-data

; Cuántos procesos en paralelo (1 es suficiente para empezar)
numprocs=1
autostart=true
autorestart=true
startsecs=1
startretries=3

; Logs
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/html/storage/logs/worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; Cierre graceful — espera que termine el job en curso antes de reiniciar
stopwaitsecs=60
killasgroup=true
stopasgroup=true
