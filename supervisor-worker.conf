[program:actividades-worker]
; Ruta al proyecto — ajustar si cambia
;
; --delay=60 : cuando un job falla (p. ej. "fwrite(): SSL operation failed" por
;   caída de conexión a Gmail), espera 60s antes de reintentar en vez de quemar
;   los 3 --tries de golpe contra la misma conexión rota. Recupera fallos transitorios.
; NOTA: se quitó --max-time=3600 porque ESE FLAG NO EXISTE en Laravel 5.7 (llegó en
;   Laravel 6) y hacía fallar el arranque del comando. El reciclado del worker para
;   soltar la conexión SMTP stale ahora lo hace el scheduler con `queue:restart`
;   cada 30 min (ver app/Console/Kernel.php), que sí es compatible con 5.7.
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --delay=60 --timeout=60
directory=/var/www/html

; Usuario con permisos sobre el proyecto (ajustar según servidor)
user=www-data

; Cuántos procesos en paralelo (1 es suficiente para empezar)
numprocs=1
autostart=true
autorestart=true
startsecs=1
startretries=3

; Logs
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/html/storage/logs/worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; Cierre graceful — espera que termine el job en curso antes de reiniciar
stopwaitsecs=60
killasgroup=true
stopasgroup=true
